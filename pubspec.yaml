name: digital_login
description: "The Digital Login Plugin simplifies the integration of Azerbaijan's digital login system, provided by Digital Login, into your Flutter applications. With this plugin, developers can enable secure and streamlined login flows using Digital Login, allowing users to authenticate via the national digital ID system."
version: 0.0.1
repository: https://github.com/htahirov/digital-login/tree/release
issue_tracker: https://github.com/htahirov/digital-login/issues
topics: [digital, digital-login, asan, asan-login]

environment:
  sdk: ">=3.5.1 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.digital_login
        pluginClass: DigitalLoginPlugin
      ios:
        pluginClass: DigitalLoginPlugin

screenshots:
  - description: The Digital Login Plugin logo.
    path: assets/digital_login_logo.png
